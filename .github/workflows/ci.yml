name: Github Actions CI

on:
    pull_request:
        branches:
            [master]
    push:
        branches:
            [master]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Clone the code
              uses: actions/checkout@v4

            - name: Install Nodejs
              uses: actions/setup-node@v4
              with:
                node-version: '20'

            - name: Install Dependencies
              run: npm ci
              
 
 


