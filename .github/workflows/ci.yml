name: Github Actions CI

on:
  pull_request:
      branches:
          [master]
  push:
      branches:
          [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
    tests:
        timeout-minutes: 10
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
            node-version: [18 , 20]
        steps:
            - name: Clone the code
              uses: actions/checkout@v4

            - name: Install Nodejs ${{matrix.node-version}}
              uses: actions/setup-node@v4
              with:
                node-version: ${{matrix.node-version}}
                cache: 'npm'

            - name: Install Dependencies
              run: npm ci
            
            - name: Run Lint
              run: npm run lint

            - name: Run integration Test
              run: npm run test:integration

            - name: Run Unit Test
              run: npm run test:unit         
            
            - name: Run Coverage Test
              run: npm run test:coverage

            - name: Upload Artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: coverage-report-${{matrix.node-version}}
                path: coverage/
      
    app:  
        timeout-minutes: 10
        needs: tests
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
            node-version: [18 , 20]
        steps:
            - name: Clone the code
              uses: actions/checkout@v4

            - name: Install Nodejs ${{matrix.node-version}}
              uses: actions/setup-node@v4
              with:
                node-version: ${{matrix.node-version}}
                cache: 'npm'

            - name: Install Dependencies
              run: npm ci
            
            - name: Start the app in background
              env:
                APP_VERSION: ${{github.sha}}
              run: |
                npm start &
                npx wait-on http://localhost:3000 --timeout 3000
                RESPONSE=$(curl -s http://localhost:3000/health)
                echo "HEALTH RESPONSE: $RESPONSE"
                
                if echo $RESPONSE | grep -q "$APP_VERSION"; then 
                  echo "Success! Exact commit version ($APP_VERSION) verified."
                else 
                  echo "Error! Expected version $APP_VERSION not found in response."
                  exit 1

                fi

              
 
 


