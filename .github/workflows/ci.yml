name: Github Actions CI

on:
  pull_request:
      branches:
          [master]
  push:
      branches:
          [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
    tests:
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            - name: Clone the code
              uses: actions/checkout@v7

            - name: Install Nodejs
              uses: actions/setup-node@v7
              with:
                node-version: '22'
                cache: 'npm'

            - name: Install Dependencies
              run: npm ci
            
            - name: Run Lint
              run: npm run lint

            - name: Run Unit Test
              run: npm run test:unit

            - name: Run Integration Test
              run: npm run test:integration         
            
            - name: Run Coverage Test
              run: npm run test:coverage

            - name: Upload Artifact
              if: always()
              uses: actions/upload-artifact@v7
              with:
                name: coverage-report
                path: coverage/
      
    app:  
        timeout-minutes: 10
        needs: tests
        runs-on: ubuntu-latest
        steps:
            - name: Clone the code
              uses: actions/checkout@v7
            
            - name: Start the app in background
              env:
                APP_VERSION: ${{github.sha}}
              run: |
                docker build --build-arg APP_VERSION=$APP_VERSION -t devops-container:$APP_VERSION .
                docker run -d --name devops-container -p3000:3000 devops-container:$APP_VERSION  
                docker logs devops-container:$APP_VERSION        
                RESPONSE=$(curl -sf --retry 10 --retry-delay 1 --retry-connrefused http://localhost:3000/health)
                echo "HEALTH RESPONSE: $RESPONSE"
                
                if echo $RESPONSE | grep -q "$APP_VERSION"; then 
                  echo "Success! Exact commit version ($APP_VERSION) verified."
                else 
                  echo "Error! Expected version $APP_VERSION not found in response."
                  exit 1

                fi

              
 
 


