name: Github Actions CI

on:
  pull_request:
    branches:
      [master]
  push:
    branches:
      [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Global level par sirf minimum read permission
permissions:
  contents: read

jobs:
  # JOB 1: Code Quality & Automated Tests
  tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Install Nodejs
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
      
      - name: Run Lint
        run: npm run lint

      - name: Run Unit Test
        run: npm run test:unit

      - name: Run Integration Test
        run: npm run test:integration         
      
      - name: Run Coverage Test
        run: npm run test:coverage

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
    
  # JOB 2: Build Image & Verify Health (No write permissions needed here)
  build-and-verify:
    timeout-minutes: 10
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
      
      - name: Build and Verify App Health
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          docker build --build-arg APP_VERSION=$APP_VERSION -t devops-container:$APP_VERSION .
          docker run -d --name devops-container -p 3000:3000 devops-container:$APP_VERSION  
          sleep 5
          docker logs devops-container      
          RESPONSE=$(curl -sf --retry 10 --retry-delay 1 --retry-connrefused http://localhost:3000/health)
          echo "HEALTH RESPONSE: $RESPONSE"
          
          if echo $RESPONSE | grep -q "$APP_VERSION"; then 
            echo "Success! Exact commit version ($APP_VERSION) verified."
          else 
            echo "Error! Expected version $APP_VERSION not found in response."
            exit 1
          fi

      # Sirf master par push hone ki surat mein image ko export karein
      - name: Export Verified Docker Image
        if: github.event_name == 'push'
        env:
          APP_VERSION: ${{ github.sha }}
        run: docker save devops-container:$APP_VERSION -o devops-container.tar

      - name: Upload Docker Image Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: devops-container.tar
          retention-days: 1

  # JOB 3: Secure Publish Job (Only runs on push to master)
  publish:
    timeout-minutes: 5
    needs: build-and-verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Sirf is job ko registry mein likhne ki ijazat hai
    permissions:
      packages: write
    steps:
      - name: Download Verified Docker Image
        uses: actions/download-artifact@v8
        with:
          name: docker-image

      - name: Load Docker Image
        run: docker load -i devops-container.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Docker Image to GHCR
        env: 
          APP_VERSION: ${{ github.sha }}
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/$OWNER_LOWER/devops-container"

          docker tag devops-container:$APP_VERSION $IMAGE_NAME:$APP_VERSION
          docker tag devops-container:$APP_VERSION $IMAGE_NAME:latest

          docker push $IMAGE_NAME:$APP_VERSION
          docker push $IMAGE_NAME:latest

  # JOB 4: Gatekeeper Job for Branch Protection
  ci-gatekeeper:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    # Yahan apni tamam jobs ke naam likhein (kal ko nayi job add ho toh bas yahan naam dal dein)
    needs: [tests, build-and-verify, publish]
    if: always()
    steps:
      - name: Check All Jobs Status
        run: |
          echo "Tests Result: ${{ needs.tests.result }}"
          echo "Build Result: ${{ needs.build-and-verify.result }}"
          echo "Publish Result: ${{ needs.publish.result }}"

          # Publish job PR par 'skipped' hogi, jo ke valid hai. Koi bhi job 'failure' ya 'cancelled' nahi honi chahiye.
          if [[ "${{ needs.tests.result }}" != "success" ]] || \
             [[ "${{ needs.build-and-verify.result }}" != "success" ]] || \
             [[ "${{ needs.publish.result }}" != "success" && "${{ needs.publish.result }}" != "skipped" ]]; then
            echo "One or more required jobs failed or were cancelled!"
            exit 1
          fi
          
          echo "All pipeline checks passed successfully!"
